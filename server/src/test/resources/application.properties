spring.datasource.generate-unique-name=true

# Off for the suite. Hundreds of accounts get registered and signed into from
# one address here, which is exactly what the limits exist to stop — and the
# limits are covered by RateLimiterTest and RateLimitedEndpointsTest, the latter
# turning them back on to check a real endpoint answers 429.
guesswho.rate-limits.enabled=false
