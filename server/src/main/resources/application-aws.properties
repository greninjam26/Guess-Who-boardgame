# How the server runs on the deployed host. Activated with
# SPRING_PROFILES_ACTIVE=aws by the systemd unit; never active locally or in
# tests, which is why the defaults elsewhere stay convenient rather than hard.

# Bound to loopback. Caddy terminates TLS and is the only thing that can reach
# the application, so the security group can expose 80 and 443 and nothing else
# — an open 8080 would be a way around the proxy that owns the certificate.
server.address=127.0.0.1
server.port=8080

# Behind that proxy, getRemoteAddr() is 127.0.0.1 for every caller in the world.
# Two of the four rate limits key on the caller's address — registering and
# signing in, which are the unauthenticated ones and the ones that take a
# password — so without this they stop being per-caller and become one global
# bucket: ten sign-in attempts a minute for the whole internet, and one person
# guessing passwords locking out every real player.
#
# Trusting the header is only safe in company with the Caddyfile, which strips
# Forwarded and replaces X-Forwarded-For rather than appending to it. Caddy
# appends by default, and Spring reads the left-most entry, so an appending
# proxy would let any caller name themselves whatever they liked.
server.forward-headers-strategy=FRAMEWORK

# Nothing about the inside of this server goes to a stranger. The status
# endpoint is the most reachable thing here and a driver's error text names
# hosts, ports and users.
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Sized for a t3.micro sharing 1 GB with PostgreSQL and Caddy. The work here is
# a handful of players polling every two seconds, so connections sit idle far
# more than they are used; a larger pool would cost memory to hold connections
# nothing is waiting on.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000

# Refuse to guess at an unexpected database. Baselining would let a server whose
# schema is not what these migrations describe start anyway and write into it.
spring.flyway.baseline-on-migrate=false

# One JSON object per line, which is what CloudWatch can search.
logging.structured.format.console=ecs

# Credentials come from the systemd unit as SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD. Nothing secret is
# in this file, because this file is in the repository.
