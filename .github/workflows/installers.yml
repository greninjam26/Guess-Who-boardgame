# Builds the desktop installers.
#
# jpackage produces only the native format of the machine it runs on, so a
# .dmg needs a macOS runner and an .msi a Windows one. There is no Linux job:
# it could not build either of them.
#
# Not run on every push. These take minutes and produce tens of megabytes, and
# nothing between releases needs them.
name: Installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Writing is needed to create the release a tag publishes. A manual run only
# uploads artifacts and never touches it.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the other worked.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            artifact: installer-macos
            pattern: target/installer/*.dmg
          - os: windows-latest
            label: Windows
            artifact: installer-windows
            pattern: target/installer/*.msi

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # jpackage builds an .msi through WiX rather than itself, and fails with
      # "Can not find WiX tools" when it is absent.
      - name: Install WiX
        if: runner.os == 'Windows'
        run: choco install wixtoolset --no-progress -y

      - name: Build installer
        # bash on the Windows runner too, so one script covers both platforms.
        shell: bash
        run: ./packaging/build-installer.sh

      # Kept for manual runs, where there is no release to attach anything to.
      # These expire, and downloading one needs a GitHub account even on a
      # public repository, so they are for checking a build rather than for
      # giving anybody the game.
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  # A separate job, rather than each build publishing its own installer: two
  # jobs creating the same release race each other, and GitHub will happily
  # hold two drafts of one tag, each with half the downloads.
  release:
    name: Draft the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Collect both installers
        uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - name: Draft the release
        uses: softprops/action-gh-release@v3
        with:
          files: installers/*
          # Left as a draft on purpose. The notes want reading before anybody
          # can download the thing they describe.
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
